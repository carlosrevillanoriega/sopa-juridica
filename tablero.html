<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1A0B2E">
<title>Tablero Sopa Jurídica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px}
header h1{font-size:clamp(1.5rem,2.8vw,2.5rem)}
header .sp{flex:1}
.count{font-size:1.1rem;font-weight:600;background:var(--card);padding:.4rem 1rem;border-radius:999px}
.count b{color:var(--rosa);font-size:1.4rem}
header .btn{font-size:.9rem;padding:.55rem 1rem}
.sel{background:var(--card);color:var(--txt);border:2px solid var(--line);border-radius:999px;padding:.5rem .9rem;font-family:inherit;font-size:.9rem;outline:none}
.btn.start{background:linear-gradient(135deg,#22C55E,#8B5CF6);box-shadow:0 6px 0 #14532D,0 0 24px rgba(34,197,94,.5);font-size:1.05rem!important;padding:.65rem 1.4rem!important;animation:pulse 1.4s infinite}
.btn.start:disabled{animation:none;background:var(--card2);box-shadow:none;opacity:.7}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#lobbyBar{display:none;text-align:center;padding:14px;margin-bottom:10px;border-radius:20px;border:2px dashed var(--lila);background:rgba(196,181,253,.08);font-size:1.3rem;font-weight:600}
#lobbyBar.on{display:block}
#lobbyBar small{display:block;font-size:.95rem;color:var(--muted);font-weight:400;margin-top:4px}
#cd{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(26,11,46,.85);pointer-events:none}
#cd.on{display:flex}
#cdTxt{font-size:clamp(6rem,24vw,18rem);font-weight:700;color:#fff;text-shadow:0 10px 0 #4C1D95;line-height:1;text-align:center}
#cdTxt.small{font-size:clamp(4rem,12vw,10rem)}
#cdTxt.go{color:#FDE047;text-shadow:0 10px 0 #7C2D12}
#cdTxt.anim{animation:cdPop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes cdPop{0%{transform:scale(2.6);opacity:0}35%{transform:scale(.9);opacity:1}55%{transform:scale(1.05)}100%{transform:scale(1)}}
.btn.warn{background:linear-gradient(135deg,#F43F5E,#BE185D);box-shadow:0 6px 0 #881337}
main{display:grid;grid-template-columns:1fr 310px;gap:16px;padding:0 20px 20px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px}
.panel h3{color:var(--lila);font-size:1rem;margin-bottom:10px}
aside{display:flex;flex-direction:column;gap:14px}
.qr{background:#fff;border-radius:16px;padding:10px;display:flex;justify-content:center;cursor:zoom-in}
.qr svg{width:100%;height:auto;max-width:230px;display:block}
.qrtxt{font-size:.85rem;color:var(--muted);text-align:center;margin-top:8px;word-break:break-all}
.inp{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:.55rem .8rem;color:var(--txt);font-size:.95rem;outline:none;margin-bottom:8px}
.inp:focus{border-color:var(--lila)}
textarea.inp{min-height:110px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{font-size:.9rem;padding:.55rem 1rem}
/* podio */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:6px 0 16px}
.pod{text-align:center;transition:all .6s}
.pod .base{border-radius:14px 14px 0 0;margin-top:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:1.6rem;font-weight:700;width:130px}
.pod .base small{font-size:.8rem;font-weight:500;opacity:.85}
.pod.p1 .base{height:96px;background:linear-gradient(180deg,#F5C542,#B7860B);color:#3b2600}
.pod.p2 .base{height:70px;background:linear-gradient(180deg,#E9E5FF,#A78BFA);color:#2E1065}
.pod.p3 .base{height:52px;background:linear-gradient(180deg,#F5B38A,#B45309);color:#3b1a00}
.pod .n{font-weight:600;max-width:150px;font-size:.95rem;line-height:1.1;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pod.p1 svg{filter:drop-shadow(0 0 14px rgba(245,197,66,.8))}
/* tarjetas */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;padding-top:22px}
.pl{position:relative;background:var(--card2);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .6s}
.pl.done{border-color:var(--oro);box-shadow:0 0 22px rgba(245,197,66,.35)}
.pl.r1{border-color:#F5C542}.pl.r2{border-color:#DDD6FE}.pl.r3{border-color:#F5B38A}
.pl .rank{position:absolute;top:8px;left:10px;font-weight:700;color:var(--muted);font-size:1.05rem}
.pl.r1 .rank{color:#F5C542}.pl.r2 .rank{color:#E9E5FF}.pl.r3 .rank{color:#F5B38A}
.pl .nm{font-weight:600;font-size:1rem;text-align:center;max-width:100%;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.pl .bar{width:100%;height:10px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.pl .bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--morado),var(--rosa));transition:transform .6s}
.pl.done .bar i{background:linear-gradient(90deg,#F5C542,#FDE68A)}
.pl .meta{font-size:.85rem;color:var(--muted)}
.pl .x{position:absolute;top:6px;right:8px;background:none;color:var(--muted);font-size:1rem;opacity:0}
.pl:hover .x{opacity:1}
.pl.up{box-shadow:0 0 0 3px var(--ok),0 0 30px rgba(52,211,153,.5)}
/* fuego */
.flames{position:absolute;left:0;right:0;top:-30px;height:44px;display:none;justify-content:center;align-items:flex-end;gap:2px;pointer-events:none}
.pl.onfire .flames{display:flex}
.pl.onfire{border-color:#FB923C;box-shadow:0 0 24px #F97316,0 -12px 50px rgba(239,68,68,.55)}
.flames i{width:20px;height:36px;background:radial-gradient(ellipse at 50% 85%,#FEF08A 0%,#FDBA74 30%,#F97316 55%,#DC2626 75%,transparent 77%);border-radius:50% 50% 40% 40%/65% 65% 35% 35%;animation:flick .45s infinite alternate;transform-origin:50% 100%;will-change:transform}
.flames i:nth-child(2){height:44px;animation-delay:.1s}.flames i:nth-child(3){height:30px;animation-delay:.2s}.flames i:nth-child(4){height:40px;animation-delay:.05s}.flames i:nth-child(5){height:28px;animation-delay:.15s}
.firetag{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#F97316,#DC2626);color:#fff;font-size:.72rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;display:none;white-space:nowrap;letter-spacing:.5px}
.pl.onfire .firetag{display:block}
@keyframes flick{from{transform:scaleY(.85) scaleX(1.05) rotate(-3deg)}to{transform:scaleY(1.15) scaleX(.92) rotate(3deg)}}
@keyframes fireGlow{from{box-shadow:0 0 18px #F97316,0 -8px 40px rgba(239,68,68,.45)}to{box-shadow:0 0 30px #FB923C,0 -16px 60px rgba(239,68,68,.7)}}
/* duelo */
#duel{display:none;align-items:center;justify-content:center;gap:18px;margin-bottom:28px;padding:12px;border-radius:22px;background:linear-gradient(90deg,rgba(124,58,237,.35),rgba(220,38,38,.45),rgba(124,58,237,.35));border:2px solid #FB923C;animation:pop .5s;box-shadow:0 0 26px #F97316,0 -12px 50px rgba(239,68,68,.55);position:relative}
#duel.on{display:flex}
#duel .who{text-align:center;font-weight:600;max-width:200px;overflow-wrap:anywhere}
#duel .vs{font-size:2.6rem;font-weight:700;color:#FDE047;text-shadow:0 0 18px #F97316,0 3px 0 #7C2D12;animation:bob .6s infinite}
#duel .msg{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:#DC2626;color:#fff;padding:.2rem .9rem;border-radius:999px;font-weight:700;white-space:nowrap;font-size:.95rem}
/* anuncio */
#announce{will-change:transform,opacity;position:fixed;left:50%;top:38%;z-index:80;pointer-events:none;font-size:clamp(2rem,5.5vw,4.4rem);font-weight:700;text-align:center;width:90vw;line-height:1.05;color:#fff;text-shadow:0 5px 0 #4C1D95,0 -2px 0 #A855F7,3px 0 0 #7C3AED,-3px 0 0 #7C3AED}
#announce.go{animation:floatUp 2.6s ease-out forwards}
#announce.fire{color:#FDE047;text-shadow:0 5px 0 #7C2D12,0 -2px 0 #F97316,3px 0 0 #DC2626,-3px 0 0 #DC2626}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:1.2rem}
.empty div{animation:bob 2s infinite;display:inline-block;font-size:2.4rem}
#zoom{position:fixed;inset:0;background:rgba(26,11,46,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:90;cursor:zoom-out;padding:20px}
#zoom.on{display:flex}
#zoom .qr{cursor:zoom-out;padding:24px}
#zoom .qr svg{max-width:min(70vh,90vw);width:min(70vh,90vw)}
#zoom p{font-size:clamp(1.2rem,3vw,2.2rem);margin-top:16px;text-align:center;font-weight:600}
.feed{position:fixed;left:20px;bottom:14px;display:flex;flex-direction:column;gap:5px;z-index:50;pointer-events:none;max-width:min(520px,60vw)}
.feed div{background:rgba(59,34,112,.92);border:2px solid var(--lila);padding:.35rem .9rem;border-radius:999px;animation:pop .5s;font-weight:500;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== modo competencia ===== */
.mclock,.resbtn{display:none!important}
body.racing .mclock{display:inline-flex!important;font-size:1.05rem;font-weight:700;color:var(--oro);background:rgba(245,197,66,.12)}
body.racing .resbtn{display:inline-block!important}
body.racing #start,body.racing aside,body.racing #podium,body.racing #players,body.racing #lobbyBar,body.racing #empty,body.racing #fs{display:none!important}
body.racing main{grid-template-columns:minmax(0,1fr)}
#race{display:none;gap:8px;align-content:start}
body.racing #race{display:grid}
#race.cols2,#race.cols3{grid-auto-flow:column;column-gap:16px}
#race.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
#race.cols3{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px}
.rrow .rmid{min-width:0}
.rrow{display:grid;grid-template-columns:46px 50px 1fr 78px;align-items:center;gap:10px;background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:6px 12px;position:relative}
.rrow .pos{font-size:1.7rem;font-weight:700;text-align:center;color:var(--muted)}
.rrow.r1{border-color:#F5C542;background:linear-gradient(90deg,rgba(245,197,66,.22),var(--card2) 45%)}.rrow.r1 .pos{color:#F5C542}
.rrow.r2{border-color:#DDD6FE;background:linear-gradient(90deg,rgba(221,214,254,.18),var(--card2) 45%)}.rrow.r2 .pos{color:#E9E5FF}
.rrow.r3{border-color:#F5B38A;background:linear-gradient(90deg,rgba(245,179,138,.18),var(--card2) 45%)}.rrow.r3 .pos{color:#F5B38A}
.rrow .rav svg{width:50px;height:50px;display:block}
.rrow .rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.02rem;margin-bottom:5px}
.track{display:grid;gap:3px;height:18px}
.track i{border-radius:5px;background:rgba(255,255,255,.09);position:relative}
.track i.on{background:linear-gradient(180deg,#C084FC,#7C3AED);animation:segIn .45s cubic-bezier(.2,1.6,.4,1)}
.rrow.done .track i.on{background:linear-gradient(180deg,#FDE68A,#F5C542)}
.rrow.fire{border-color:#FB923C;box-shadow:0 0 22px rgba(249,115,22,.55)}
.rrow.fire .track i.on{background:linear-gradient(180deg,#FDE047,#F97316 55%,#DC2626)}
.rrow.fire .track i.tip::after{content:'';position:absolute;right:-7px;bottom:3px;width:18px;height:32px;background:radial-gradient(ellipse at 50% 85%,#FEF08A 0%,#FDBA74 30%,#F97316 55%,#DC2626 75%,transparent 77%);border-radius:50% 50% 40% 40%/65% 65% 35% 35%;animation:flick .4s infinite alternate;transform-origin:50% 100%;will-change:transform}
@keyframes segIn{from{transform:scaleY(.2)}to{transform:none}}
.rrow .rstat{text-align:right;font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.rrow .rstat small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.rrow.done .rstat{color:#F5C542}
.rrow .mv{position:absolute;left:6px;top:-10px;font-size:.75rem;font-weight:700;color:#06281c;background:var(--ok);border-radius:999px;padding:0 .45rem;opacity:0}
.rrow.up{box-shadow:0 0 0 2px var(--ok)}
.rrow.up .mv{animation:mvUp 1.3s}
@keyframes mvUp{0%{opacity:0;transform:translateY(6px)}20%,80%{opacity:1;transform:none}100%{opacity:0}}
#race.cols2 .rrow,#race.cols3 .rrow{grid-template-columns:34px 38px 1fr 58px;padding:4px 10px;gap:8px;border-radius:12px}
#race.cols2 .rav svg,#race.cols3 .rav svg{width:38px;height:38px}
#race.cols2 .pos,#race.cols3 .pos{font-size:1.2rem}
#race.cols2 .rname,#race.cols3 .rname{font-size:.88rem;margin-bottom:3px}
#race.cols2 .track,#race.cols3 .track{height:13px;gap:2px}
#race.cols2 .rstat,#race.cols3 .rstat{font-size:.95rem}
#race.cols2 .rrow.fire .track i.tip::after,#race.cols3 .rrow.fire .track i.tip::after{height:22px;width:14px;right:-5px;bottom:1px}
body.racing #feed{display:none}
body.racing #duel{padding:6px 12px;gap:14px;margin-bottom:22px;border-radius:16px}
body.racing #duel svg{width:46px;height:46px}
body.racing #duel .who{display:flex;align-items:center;gap:8px;max-width:none;text-align:left}
body.racing #duel .who small{margin-left:6px;color:var(--oro);font-weight:700}
body.racing #duel .vs{font-size:1.8rem}
body.racing #duel .msg{font-size:.85rem;bottom:-12px}
/* resultados finales */
#final{position:fixed;inset:0;z-index:88;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 600px at 50% 30%,#5B21B6 0%,transparent 70%),rgba(26,11,46,.96)}
#final.on{display:flex}
.fbox{text-align:center;max-width:900px;width:100%;animation:pop .6s}
.fbox h2{font-size:clamp(2.2rem,5vw,3.8rem)}
.fsub{color:var(--lila2);font-size:1.2rem;margin:6px 0 10px}
.fpod .base{width:170px}
.fpod .pod.p1 .base{height:140px}.fpod .pod.p2 .base{height:100px}.fpod .pod.p3 .base{height:76px}
.fpod .n{max-width:190px;font-size:1.1rem}
.frest{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 22px}
.frest span{background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:.3rem .9rem;font-weight:500}
.fbtns{justify-content:center}
.fbtns .btn{font-size:1.15rem!important;padding:.8rem 1.6rem!important}
/* modos compactos para muchos jugadores */
.players.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.players.compact .pl{padding:8px;gap:4px;border-radius:16px}
.players.compact .av svg{width:58px;height:58px}
.players.compact .nm{font-size:.88rem;min-height:2.2em}
.players.mini{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.players.mini .pl{padding:6px 6px 8px;gap:3px;border-radius:14px}
.players.mini .av svg{width:42px;height:42px}
.players.mini .nm{font-size:.78rem;-webkit-line-clamp:1;min-height:1.2em}
.players.mini .meta{font-size:.72rem}
.players.mini .rank{font-size:.8rem;top:4px;left:7px}
.players.mini .flames{top:-22px;height:30px}.players.mini .flames i{width:13px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:75}
</style>
</head>
<body>
<header>
  <h1 class="title">Sopa Jurídica · Tablero</h1>
  <span class="pill"><span class="dot" id="netDot"></span><span id="netTxt">conectando</span></span>
  <span class="pill">Sala: <b id="sala"></b></span>
  <span class="sp"></span>
  <span class="pill mclock" id="mclock"></span>
  <span class="count"><b id="cnt">0</b> jugadores</span>
  <button class="btn" id="sound">Activar voz</button>
  <select class="sel" id="music" title="Música">
    <option value="">Música: apagada</option>
    <option value="korobeiniki">Korobeiniki (duelo)</option>
    <option value="montana">Rey de la Montaña (tensión)</option>
    <option value="galope">Galope final (carrera)</option>
  </select>
  <button class="btn start" id="start">Iniciar juego</button>
  <button class="btn ghost resbtn" id="results">Ver resultados</button>
  <button class="btn warn" id="restart">Reiniciar juego</button>
  <button class="btn ghost" id="fs">Pantalla completa</button>
</header>
<main>
  <section>
    <div id="lobbyBar"></div>
    <div id="duel"></div>
    <div id="race"></div>
    <div class="podium" id="podium"></div>
    <div class="players" id="players"></div>
    <div class="empty" id="empty"><div>&#9878;</div><br>Esperando abogados... escaneen el QR para entrar</div>
  </section>
  <aside>
    <div class="panel">
      <h3>1 · Entra al juego</h3>
      <div class="qr" id="qrGame"></div>
      <div class="qrtxt" id="gameUrl"></div>
    </div>
    <div class="panel">
      <h3>2 · ¿Sin datos? Conéctate al WiFi</h3>
      <div class="qr" id="qrWifi"></div>
      <div class="qrtxt" id="wifiTxt"></div>
      <div style="margin-top:10px">
        <input class="inp" id="ssid" placeholder="Nombre de la red (SSID)">
        <input class="inp" id="pass" placeholder="Contraseña">
      </div>
    </div>
    <div class="panel">
      <h3>Palabras de la ronda</h3>
      <textarea class="inp" id="wordsIn" placeholder="Una palabra por línea o separadas por coma"></textarea>
      <div class="btns">
        <button class="btn" id="newRound">Aplicar palabras</button>
        <button class="btn ghost" id="clear">Borrar jugadores</button>
      </div>
      <div class="qrtxt" id="roundInfo"></div>
    </div>
  </aside>
</main>
<div id="final"><div class="fbox">
  <h2 class="title">¡Se levanta la sesión!</h2>
  <p class="fsub" id="fsub"></p>
  <div class="podium fpod" id="fpod"></div>
  <div class="frest" id="frest"></div>
  <div class="btns fbtns"><button class="btn warn" id="fRestart">Reiniciar juego</button><button class="btn ghost" id="fClose">Ver la carrera</button></div>
</div></div>
<div id="zoom"><div class="qr" id="zoomQr"></div><p id="zoomTxt"></p></div>
<div id="announce"></div>
<div id="cd"><div id="cdTxt"></div></div>
<div class="feed" id="feed"></div>
<canvas id="fx"></canvas>

<script src="mqtt.min.js"></script>
<script src="qrcode.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
$('sala').textContent = SJ.SALA;
let soundOn = false, config = null, players = {}, client;
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- QR ---------- */
function qrSVG(text) {
  const q = qrcode(0, 'M'); q.addData(unescape(encodeURIComponent(text))); q.make();
  return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
}
const GAME_URL = SJ.gameURL();
$('qrGame').innerHTML = qrSVG(GAME_URL);
$('gameUrl').textContent = GAME_URL;
$('qrGame').dataset.label = GAME_URL;
const wesc = s => s.replace(/([\\;,:"])/g, '\\$1');
function renderWifi() {
  const ssid = $('ssid').value.trim(), pass = $('pass').value;
  SJ.store.set('wifi', { ssid, pass });
  if (!ssid) { $('qrWifi').innerHTML = '<div style="color:#5B3E96;padding:40px 10px;text-align:center">Escribe la red abajo</div>'; $('wifiTxt').textContent = ''; return; }
  const str = `WIFI:T:${pass ? 'WPA' : 'nopass'};S:${wesc(ssid)};${pass ? 'P:' + wesc(pass) + ';' : ''};`;
  $('qrWifi').innerHTML = qrSVG(str);
  $('wifiTxt').textContent = `Red: ${ssid}${pass ? ' · Clave: ' + pass : ''}`;
  $('qrWifi').dataset.label = `WiFi: ${ssid}${pass ? ' · ' + pass : ''}`;
}
const wifi = SJ.store.get('wifi') || {};
$('ssid').value = SJ.params.get('ssid') || wifi.ssid || '';
$('pass').value = SJ.params.get('pass') || wifi.pass || '';
$('ssid').oninput = $('pass').oninput = renderWifi; renderWifi();
document.querySelectorAll('aside .qr').forEach(el => el.onclick = () => {
  if (!el.querySelector('svg')) return;
  $('zoomQr').innerHTML = el.innerHTML; $('zoomTxt').textContent = el.dataset.label || ''; $('zoom').classList.add('on');
});
$('zoom').onclick = () => $('zoom').classList.remove('on');

/* ---------- controles ---------- */
$('sound').onclick = () => { soundOn = !soundOn; $('sound').textContent = soundOn ? 'Voz activa' : 'Activar voz'; if (soundOn) { SJ.sfx.join(); SJ.say('Voz activada. ¡Se abre la sesión del tribunal!', 'happy'); } };
$('music').onchange = e => { const v = e.target.value; if (v) SJ.musicPlay(v); else SJ.musicStop(); };

function parseWords() {

}
function publishConfig(words) {
  config = { round: 'r' + Date.now().toString(36), words, ts: Date.now(), state: 'lobby' };
  client.publish(SJ.BASE + '/config', JSON.stringify(config), { retain: true, qos: 1 });
  showConfig(); resetState(); updateStart();
}
function clearPlayers() {
  Object.keys(players).forEach(id => client.publish(SJ.BASE + '/p/' + id, '', { retain: true, qos: 1 }));
  players = {}; render();
}
function resetState() { streak = {}; onFire = {}; leaderId = null; lastDuel = 0; finalShown = false; $('duel').classList.remove('on'); $('final').classList.remove('on'); }
$('newRound').onclick = () => {
  const w = parseWords(); if (w.length < 3) { alertFeed('Pon al menos 3 palabras'); return; }
  clearPlayers(); publishConfig(w); announce('¡Nueva ronda!'); if (soundOn) SJ.sayQ('¡Nueva ronda! Se abre un nuevo expediente.', 'hype', 3);
};
let armed = 0;
$('restart').onclick = () => {
  if (Date.now() - armed > 3000) { armed = Date.now(); $('restart').textContent = '¿Seguro? Toca otra vez'; setTimeout(() => $('restart').textContent = 'Reiniciar juego', 3000); return; }
  armed = 0; $('restart').textContent = 'Reiniciar juego';
  doRestart();
};
function doRestart() {
  const w = config ? config.words : SJ.DEFAULT_WORDS;
  clearPlayers(); publishConfig(w);
  announce('¡Juego reiniciado!'); if (soundOn) SJ.sayQ('¡Juego reiniciado! Todos a sus lugares. Se abre la audiencia.', 'hype', 3);
};
$('clear').onclick = clearPlayers;
function updateStart() {
  const lobby = config && config.state === 'lobby';
  $('start').disabled = !lobby;
  $('start').textContent = lobby ? 'Iniciar juego' : 'En juego';
  const n = sorted().length;
  $('lobbyBar').classList.toggle('on', !!lobby);
  updateMode();
  setHTML($('lobbyBar'), `Sala de espera: ${n} ${n === 1 ? 'abogado listo' : 'abogados listos'}<small>Escaneen el QR para entrar. Cuando estén todos, presiona "Iniciar juego".</small>`);
}
$('start').onclick = () => {
  if (!config || config.state !== 'lobby') return;
  config = { ...config, state: 'countdown', startAt: Date.now() + SJ.CD_MS, ts: Date.now() };
  client.publish(SJ.BASE + '/config', JSON.stringify(config), { retain: true, qos: 1 });
  updateStart();
  SJ.countdown(SJ.CD_MS, (txt, go) => {
    $('cd').classList.add('on');
    const el = $('cdTxt'); el.textContent = txt; el.className = (txt.length > 2 ? 'small ' : '') + (go ? 'go ' : '');
    void el.offsetWidth; el.classList.add('anim');
  }, () => {
    setTimeout(() => $('cd').classList.remove('on'), 900);
    for (let i = 0; i < 4; i++) setTimeout(() => burst(innerWidth * (.2 + .6 * Math.random()), innerHeight * .4, 100), i * 200);
    if (SJ.music.on && SJ.music.id) SJ.musicPlay(SJ.music.id);
    updateMode();
  });
};
function showConfig() {
  if (!config) return;
  $('wordsIn').value = config.words.join('\n');
  $('roundInfo').textContent = `${config.words.length} palabras · ronda ${config.round}`;
}

/* ---------- efectos ---------- */
function announce(t, fire) {

}
function alertFeed(t) {

  while ($('feed').children.length > 3) $('feed').firstChild.remove();
  setTimeout(() => d.remove(), 5000);
}
function voice(t, mood, prio) { if (soundOn) SJ.sayQ(t, mood, prio); }
const fx = $('fx'), fctx = fx.getContext('2d'); let parts = [];
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener('resize', sizeFx); sizeFx();
const COLS = ['#C4B5FD', '#F0ABFC', '#8B5CF6', '#F5C542', '#FFFFFF', '#A78BFA', '#FB923C'];
function burst(x, y, n) {
  const was = parts.length;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, life: 70 + Math.random() * 50, c: COLS[i % COLS.length], w: 5 + Math.random() * 7, rot: Math.random() * 6 }); }

}
function loop() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .985; p.life--; p.rot += .2; fctx.save(); fctx.globalAlpha = Math.min(1, p.life / 30); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); fctx.restore(); });

}
function cardEl(id) { return document.querySelector(`${racing ? '.rrow' : '.pl'}[data-id="${CSS.escape(id)}"]`); }
function burstAt(id, n) { const el = cardEl(id); if (!el) return; const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 3, n); }

/* ---------- render con animación de reacomodo ---------- */
function sorted() { return SJ.rank(Object.values(players).filter(p => !config || p.round === config.round)); }
const fmt = s => s == null ? '' : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
let onFire = {}, streak = {};
let renderT = null;
function render() { if (renderT) return; renderT = setTimeout(() => { renderT = null; renderNow(); }, racing ? 450 : 180); }
function setHTML(el, html) { if (el._h !== html) { el._h = html; el.innerHTML = html; } }
/* ---------- modo competencia ---------- */
let racing = false, finalShown = false, modeT = null;
function updateMode() {
  clearTimeout(modeT);
  const st = config && config.state;
  const wait = st === 'countdown' ? (config.startAt || 0) - Date.now() - 200 : 0;
  if (st === 'countdown' && wait > 0) modeT = setTimeout(updateMode, wait);
  const v = st === 'countdown' && wait <= 0;
  if (v === racing) return;
  racing = v; document.body.classList.toggle('racing', v);
  if (!v) $('final').classList.remove('on');
  renderNow();
}
setInterval(() => {
  if (!racing || !config) return;
  const list = sorted(), done = list.filter(p => p.done).length;
  const secs = Math.max(0, Math.floor((Date.now() - config.startAt) / 1000));
  $('mclock').textContent = `Tiempo ${fmt(secs)} · ${done}/${list.length} terminaron`;
}, 500);
function renderRace(list) {
  const race = $('race');
  race.classList.toggle('cols2', list.length > 12 && list.length <= 36);
  race.classList.toggle('cols3', list.length > 36);
  const cols = list.length > 36 ? 3 : list.length > 12 ? 2 : 1;
  race.style.gridTemplateRows = cols > 1 ? `repeat(${Math.ceil(list.length / cols)},auto)` : '';
  const first = new Map();
  [...race.children].forEach(el => first.set(el.dataset.id, el.getBoundingClientRect()));
  const ids = new Set(list.map(p => p.id));
  [...race.children].forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  const now = Date.now();
  list.forEach((p, i) => {
    let el = race.querySelector(`.rrow[data-id="${CSS.escape(p.id)}"]`);
    if (!el) {
      el = document.createElement('div'); el.className = 'rrow'; el.dataset.id = p.id;
      el.innerHTML = `<span class="mv">SUBE</span><div class="pos"></div><div class="rav"></div><div class="rmid"><div class="rname"></div><div class="track"></div></div><div class="rstat"></div>`;
    }
    if (el._pos !== i + 1) { if (el._pos && i + 1 < el._pos) el._up = true; el._pos = i + 1; el.querySelector('.pos').textContent = i + 1; }
    const avKey = JSON.stringify(p.look);
    if (el.dataset.av !== avKey) { el.querySelector('.rav').innerHTML = SJ.avatarSVG(p.look || SJ.randomLook(p.id), 50); el.dataset.av = avKey; }
    if (el._nick !== p.nick) { el._nick = p.nick; el.querySelector('.rname').textContent = p.nick; }
    const tr = el.querySelector('.track');
    if (tr.children.length !== p.total) { tr.style.gridTemplateColumns = `repeat(${p.total},1fr)`; tr.innerHTML = '<i></i>'.repeat(p.total); }
    [...tr.children].forEach((seg, k) => { seg.classList.toggle('on', k < p.found); seg.classList.toggle('tip', k === p.found - 1); });
    const stat = p.done ? `${fmt(p.time)}<small>caso cerrado</small>` : `${p.found}/${p.total}<small>palabras</small>`;
    setHTML(el.querySelector('.rstat'), stat);
    el.classList.toggle('done', !!p.done);
    el.classList.toggle('fire', !p.done && !!onFire[p.id] && onFire[p.id] > now);
    ['r1', 'r2', 'r3'].forEach((c, k) => el.classList.toggle(c, i === k && p.found > 0));
    if (race.children[i] !== el) race.insertBefore(el, race.children[i] || null);
  });
  [...race.children].forEach(el => {
    const f = first.get(el.dataset.id); if (!f) return;
    const l = el.getBoundingClientRect(), dx = f.left - l.left, dy = f.top - l.top;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
      el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'translate(0,0)' }], { duration: 420, easing: 'cubic-bezier(.2,.9,.25,1)' });
    }
    if (el._up) { el._up = false; el.classList.remove('up'); void el.offsetWidth; el.classList.add('up'); setTimeout(() => el.classList.remove('up'), 1300); }
  });
  if (!finalShown && list.length && list.every(p => p.done)) { finalShown = true; setTimeout(() => showFinal(true), 1400); }
}
function podiumHTML(list, sz) {
  const top = list.filter(p => p.found > 0).slice(0, 3), order = [top[1], top[0], top[2]], pl = [2, 1, 3];
  return order.map((p, k) => p ? `<div class="pod p${pl[k]}">${SJ.avatarSVG(p.look, sz[k])}<div class="n">${SJ.esc(p.nick)}</div><div class="base">${pl[k]}°<small>${p.done ? fmt(p.time) : p.found + '/' + p.total}</small></div></div>` : '').join('');
}
function showFinal(auto) {
  const list = sorted(); if (!list.length) return;
  $('fpod').innerHTML = podiumHTML(list, [96, 130, 84]);
  $('frest').innerHTML = list.slice(3, 15).map((p, i) => `<span>${i + 4}° ${SJ.esc(p.nick)} · ${p.done ? fmt(p.time) : p.found + '/' + p.total}</span>`).join('');
  const done = list.filter(p => p.done).length;
  $('fsub').textContent = done === list.length ? `Los ${list.length} abogados cerraron su caso` : `${done} de ${list.length} cerraron su caso`;
  $('final').classList.add('on');
  SJ.sfx.win();
  for (let i = 0; i < 6; i++) setTimeout(() => burst(innerWidth * (.15 + .7 * Math.random()), innerHeight * .35, 110), i * 260);
  if (list[0]) voice(`${auto ? '¡Todos cerraron su caso! ' : ''}Se levanta la sesión. El ganador del juicio es ${list[0].nick}. ¡Sentencia firme!`, 'hype', 3);
}
$('results').onclick = () => showFinal(false);
$('fClose').onclick = () => $('final').classList.remove('on');
$('fRestart').onclick = () => { $('final').classList.remove('on'); doRestart(); };

function renderNow() {
  const list = sorted();
  $('cnt').textContent = list.length;
  if (racing) { renderRace(list); musicIntensity(list); return; }
  $('empty').style.display = list.length ? 'none' : 'block';
  const container = $('players');
  container.classList.toggle('compact', list.length > 15 && list.length <= 30);
  container.classList.toggle('mini', list.length > 30);
  const first = new Map();
  [...container.children].forEach(el => first.set(el.dataset.id, el.getBoundingClientRect()));
  const ids = new Set(list.map(p => p.id));
  [...container.children].forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  list.forEach((p, i) => {
    let el = cardEl(p.id);
    if (!el) {
      el = document.createElement('div'); el.className = 'pl'; el.dataset.id = p.id;
      el.innerHTML = `<div class="flames"><i></i><i></i><i></i><i></i><i></i></div><span class="rank"></span><button class="x" title="Quitar">&#10005;</button><div class="av"></div><div class="nm"></div><div class="bar"><i></i></div><div class="meta"></div><span class="firetag">EN RACHA</span>`;
      el.querySelector('.x').onclick = () => client.publish(SJ.BASE + '/p/' + p.id, '', { retain: true, qos: 1 });
    }
    const rk = (i + 1) + '°'; if (el._rk !== rk) { el._rk = rk; el.querySelector('.rank').textContent = rk; }
    const avKey = JSON.stringify(p.look);
    if (el.dataset.av !== avKey) { el.querySelector('.av').innerHTML = SJ.avatarSVG(p.look || SJ.randomLook(p.id), 84); el.dataset.av = avKey; }
    el.querySelector('.nm').textContent = p.nick;
    const sx = 'scaleX(' + (p.found / p.total) + ')'; const bi = el.querySelector('.bar i'); if (bi.style.transform !== sx) bi.style.transform = sx;
    el.querySelector('.meta').textContent = p.done ? `Caso cerrado en ${fmt(p.time)}` : `${p.found}/${p.total} palabras`;
    el.classList.toggle('done', !!p.done);
    el.classList.toggle('onfire', !!onFire[p.id] && onFire[p.id] > Date.now());
    ['r1', 'r2', 'r3'].forEach((c, k) => el.classList.toggle(c, i === k && p.found > 0));
    if (container.children[i] !== el) container.insertBefore(el, container.children[i] || null);
  });
  // FLIP: animar el desplazamiento de cada tarjeta
  [...container.children].forEach(el => {
    const f = first.get(el.dataset.id); if (!f) return;
    const l = el.getBoundingClientRect(), dx = f.left - l.left, dy = f.top - l.top;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
      el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'translate(0,0)' }], { duration: 650, easing: 'cubic-bezier(.2,.9,.25,1)' });
      if (dy > 2 || (dy === 0 && dx > 2)) { el.classList.add('up'); setTimeout(() => el.classList.remove('up'), 1200); }
    }
  });
  setHTML($('podium'), podiumHTML(list, [72, 100, 62]));
  musicIntensity(list);
}
function musicIntensity(list) {
  // intensidad de la música: sube el tempo cuando la carrera está cerrada o alguien está por terminar
  const L = list[0], S = list[1];
  let mul = 1;
  if (L && S && !L.done && L.found - S.found <= 1 && S.found >= 2) mul += .12;
  if (L && !L.done && L.found / L.total >= .7) mul += .1;
  SJ.music.mul = mul;
}

/* ---------- narrador ---------- */
const PRAISE = ['¡Sublime, {n}!', '¡Bien hecho, {n}!', '¡{n} está imparable!', '¡Ha lugar, {n}!', '¡Jurisprudencia pura, {n}!', '¡Con todo el peso de la ley, {n}!', '¡Argumento irrefutable de {n}!', '¡{n} presenta pruebas contundentes!', '¡Se acepta la prueba de {n}!'];
const LEADER = ['¡Nuevo líder! {n} toma la delantera', '¡Se revoca la sentencia! {n} pasa al primer lugar', '¡{n} encabeza el expediente!', '¡Cambio de jurisprudencia! {n} va primero'];
const PASS = ['¡{n} rebasó a {o}! Apelación aceptada', '¡{n} deja atrás a {o}!', '¡{o}, te rebasó {n}! Hay que apelar'];
const DUEL = ['¡Casi te alcanzan, {l}!', '¡Duelo en el tribunal! {l} contra {s}', '¡Esto se define en última instancia!', '¡{s} le pisa los talones a {l}!', '¡Careo de alto nivel: {l} contra {s}!'];
const FIRE = ['¡{n} está arrasando!', '¡{n} está en llamas!', '¡{n} viene con todo el código penal!', '¡Nadie detiene a {n}!'];
const fill = (t, o) => t.replace(/\{(\w)\}/g, (_, k) => o[k] || '');
let leaderId = null, lastDuel = 0;
function showDuel(L, S) {
  const d = $('duel');
  d.innerHTML = `<div class="who">${SJ.avatarSVG(L.look, 70)}<div>${SJ.esc(L.nick)}</div><small>${L.found}/${L.total}</small></div><div class="vs">VS</div><div class="who">${SJ.avatarSVG(S.look, 70)}<div>${SJ.esc(S.nick)}</div><small>${S.found}/${S.total}</small></div><div class="msg">${L.found === S.found ? '¡EMPATE TÉCNICO!' : '¡CASI TE ALCANZAN!'}</div>`;
  d.classList.remove('on'); void d.offsetWidth; d.classList.add('on');
  clearTimeout(showDuel.t); showDuel.t = setTimeout(() => d.classList.remove('on'), 7000);
}
function events(id, data, prev, before) {
  const after = sorted(), ids = after.map(p => p.id);
  const oldIdx = before.indexOf(id), newIdx = ids.indexOf(id), n = data.nick;
  if (!prev) {
    alertFeed(`${n} entró a la sala`);
    if (soundOn) SJ.sfx.join();
    voice(`Se presenta ${n} en el juzgado`, 'happy', 1);
    return;
  }
  if (data.found <= prev.found) return;
  const now = Date.now();
  streak[id] = (streak[id] || []).filter(t => now - t < 30000); streak[id].push(now);
  let spoke = false;
  if (data.done && !prev.done) {
    const firstDone = after.filter(p => p.done).length === 1;
    if (firstDone) { announce(`¡CASO CERRADO! ${n} gana el juicio`, true); voice(`¡Caso cerrado! ${n} gana el juicio. ¡Sentencia firme!`, 'hype', 3); if (soundOn) SJ.sfx.win(); for (let i = 0; i < 5; i++) setTimeout(() => burst(innerWidth * Math.random(), innerHeight * .5 * Math.random(), 90), i * 280); }
    else { alertFeed(`${n} cerró su caso en ${fmt(data.time)}`); voice(`${n} cerró su caso. Lugar número ${newIdx + 1}`, 'happy', 1); burstAt(id, 60); }
    return;
  }
  if (streak[id].length >= 3) {
    onFire[id] = now + 10000; setTimeout(render, 10100);
    const t = fill(pick(FIRE), { n }); announce(t, true); voice(t, 'hype', 2); spoke = true;
    streak[id] = [];
  }
  if (ids[0] === id && leaderId !== id && data.found >= 1 && before.length > 1) {
    const t = fill(pick(LEADER), { n }); if (!spoke) announce(t); voice(t, 'hype', 2); spoke = true; burstAt(id, 70);
  } else if (oldIdx > -1 && newIdx < oldIdx && !spoke) {
    const o = players[before[newIdx]]; if (o) { const t = fill(pick(PASS), { n, o: o.nick }); alertFeed(t); voice(t, 'happy', 1); spoke = true; }
  }
  leaderId = ids[0];
  const L = after[0], S = after[1];
  if (L && S && !L.done && (id === L.id || id === S.id) && L.found - S.found <= 1 && S.found >= 2 && now - lastDuel > 12000) {
    lastDuel = now; showDuel(L, S);
    const t = fill(pick(DUEL), { l: L.nick, s: S.nick }); if (!spoke) announce(t, true); voice(t, 'hype', 2); spoke = true;
  }
  if (!spoke && data.found === Math.ceil(data.total / 2)) { alertFeed(`${n} va a la mitad del expediente`); voice(`${n} va a la mitad del expediente`, 'calm', 1); spoke = true; }
  if (!spoke && Math.random() < .3) voice(fill(pick(PRAISE), { n }), 'hype', 1);
  if (soundOn && !spoke) SJ.sfx.tick();
}

/* ---------- tiempo real ---------- */
function setNet(s) { $('netDot').className = 'dot ' + s; $('netTxt').textContent = { online: 'en vivo', reconnect: 'reconectando', offline: 'sin conexión', error: 'error de red' }[s] || s; }
let gotConfig = false, ready = false;
client = SJ.connect((topic, data) => {
  if (topic === 'config') { if (data && data.words) { if (config && config.round !== data.round) resetState(); config = data; gotConfig = true; if (!data.state) { publishConfig(data.words); return; } showConfig(); render(); updateStart(); } return; }
  if (!topic.startsWith('p/')) return;
  const id = topic.slice(2);
  if (!data) { delete players[id]; render(); updateStart(); return; }
  if (!data.nick || typeof data.found !== 'number') return;
  const prev = players[id] && (!config || players[id].round === config.round) ? players[id] : null;
  const before = sorted().map(p => p.id);
  data.nick = String(data.nick).slice(0, 50);
  players[id] = data;
  render(); updateStart();
  if (config && data.round !== config.round) return;
  if (ready) events(id, data, prev, before);
}, setNet);
client.on('connect', () => {
  client.subscribe([SJ.BASE + '/config', SJ.BASE + '/p/+'], { qos: 1 });
  setTimeout(() => ready = true, 2000);
  setTimeout(() => { if (!gotConfig) { $('wordsIn').value = SJ.DEFAULT_WORDS.join('\n'); publishConfig(SJ.DEFAULT_WORDS); } }, 2500);
});
